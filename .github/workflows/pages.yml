# 単一HTML版のFPSゲームを GitHub Pages に公開する。
# Pages の設定（Source: GitHub Actions）は configure-pages が自動で有効化する。
name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/browser-fps-game-1tc5a9
    paths:
      - 'src/game/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 依存パッケージなしで動くビルド（素の Node のみ）
      - name: Build standalone game
        run: node scripts/build-standalone.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-standalone

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
